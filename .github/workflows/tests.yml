name: tests

on:
  push:
  pull_request:

jobs:
  debian:
    # GitHub's Ubuntu images have no libsdl3; Debian 13 ships SDL 3.2, the
    # oldest release the binding targets, with Python 3.13. Building the
    # package (debian/, debhelper + pybuild) runs the test suite too.
    name: Debian 13 / Python 3.13 (SDL 3.2) - package + tests
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts lintian autopkgtest
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: apt-get build-dep -y ./
      - name: Build package (runs the tests with the dummy drivers)
        run: dpkg-buildpackage -us -uc -b
      - name: Lintian
        run: lintian --pedantic --info --fail-on error,warning ../*.changes
      - name: autopkgtest (installs the .deb)
        run: autopkgtest ../python3-sdl3_*.deb . -- null
      - name: Collect the .deb
        run: mkdir -p dist && cp ../*.deb dist/
      - uses: actions/upload-artifact@v7
        with:
          name: python3-sdl3-deb
          path: dist/*.deb

  macos:
    name: macOS / Python ${{ matrix.python }} (Homebrew SDL)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: brew install pkg-config sdl3 sdl3_image sdl3_ttf sdl3_mixer
      - run: python -m pip install --upgrade pip setuptools pytest
      - name: Build
        run: python setup.py build
      - name: Test (dummy video / audio drivers)
        run: python -m pytest -q -rs
