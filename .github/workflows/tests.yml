name: tests

on:
  push:
  pull_request:

jobs:
  debian:
    # GitHub's Ubuntu images have no libsdl3; Debian 13 ships SDL 3.2, the
    # oldest release the binding targets, with Python 3.13.
    name: Debian 13 / Python 3.13 (SDL 3.2)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install SDL3 and build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config \
            python3-dev python3-setuptools python3-pytest libsdl3-dev libsdl3-image-dev
      - uses: actions/checkout@v7
      - name: Build
        run: python3 setup.py build
      - name: Test (dummy video / audio drivers)
        run: python3 -m pytest -q -rs

  macos:
    name: macOS / Python ${{ matrix.python }} (Homebrew SDL)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: brew install pkg-config sdl3 sdl3_image
      - run: python -m pip install --upgrade pip setuptools pytest
      - name: Build
        run: python setup.py build
      - name: Test (dummy video / audio drivers)
        run: python -m pytest -q -rs
